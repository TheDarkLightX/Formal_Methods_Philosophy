name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit tutorial math source
        run: |
          python3 scripts/audit_markdown_math.py \
            tutorials/what-is-reasoning-proof-search-and-justification.md \
            tutorials/what-is-two.md \
            tutorials/two-ways-to-prove-equality.md

      - name: Verify the one-plus-one lab
        run: node tests/one_plus_one_proof_core.test.js

      - name: Audit public repository safety
        run: bash scripts/audit_public_repo_safety.sh

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
