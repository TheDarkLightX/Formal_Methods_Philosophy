<svg
  class="fp-diagram"
  viewBox="0 0 960 520"
  role="img"
  aria-labelledby="fp-swap-reflection-title fp-swap-reflection-desc"
  xmlns="http://www.w3.org/2000/svg"
>
  <title id="fp-swap-reflection-title">Swapping two coordinates is reflection across the line y equals x</title>
  <desc id="fp-swap-reflection-desc">
    The point with coordinates 3 and 1 is reflected across the diagonal line y equals x to the point with coordinates 1 and 3. Points on the diagonal are fixed by the swap.
  </desc>

  <defs>
    <marker id="fp-swap-reflection-arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#D97757" />
    </marker>
    <filter id="fp-swap-reflection-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F2747" flood-opacity="0.10" />
    </filter>
  </defs>

  <rect x="28" y="28" width="904" height="464" rx="28" fill="#FFFDF8" stroke="#E5E7EB" filter="url(#fp-swap-reflection-shadow)" />

  <g stroke="#DDE6EA" stroke-width="1">
    <path d="M80 100 H570 M80 180 H570 M80 260 H570 M80 340 H570 M80 420 H570" />
    <path d="M120 70 V450 M200 70 V450 M280 70 V450 M360 70 V450 M440 70 V450 M520 70 V450" />
  </g>

  <g stroke="#173B63" stroke-width="3" stroke-linecap="round">
    <path d="M80 420 H580" />
    <path d="M120 455 V60" />
  </g>
  <text x="585" y="426" font-size="18" fill="#173B63" font-family="Atkinson Hyperlegible, system-ui, sans-serif">x</text>
  <text x="110" y="52" font-size="18" fill="#173B63" font-family="Atkinson Hyperlegible, system-ui, sans-serif">y</text>

  <path d="M90 450 L490 50" stroke="#1C9A92" stroke-width="6" stroke-linecap="round" />
  <text x="410" y="82" font-size="18" font-weight="700" fill="#14766F" font-family="Atkinson Hyperlegible, system-ui, sans-serif">fixed line y = x</text>

  <path d="M360 340 L200 180" stroke="#8095A8" stroke-width="3" stroke-dasharray="8 8" />
  <path d="M355 327 C325 245 280 205 215 184" fill="none" stroke="#D97757" stroke-width="5" marker-end="url(#fp-swap-reflection-arrow)" />

  <circle cx="360" cy="340" r="11" fill="#D97757" stroke="#FFFFFF" stroke-width="4" />
  <circle cx="200" cy="180" r="11" fill="#173B63" stroke="#FFFFFF" stroke-width="4" />
  <text x="374" y="368" font-size="18" font-weight="700" fill="#A8462A" font-family="Atkinson Hyperlegible, system-ui, sans-serif">p = (3, 1)</text>
  <text x="130" y="158" font-size="18" font-weight="700" fill="#173B63" font-family="Atkinson Hyperlegible, system-ui, sans-serif">swap(p) = (1, 3)</text>

  <g font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    <text x="635" y="145" font-size="18" font-weight="800" fill="#C17C22">THE SWAP</text>
    <text x="635" y="205" font-size="27" font-weight="800" fill="#173B63">swap(x, y) = (y, x)</text>
    <text x="635" y="273" font-size="17" fill="#425466">Geometrically, this is a reflection.</text>
    <text x="635" y="315" font-size="17" fill="#425466">The point stays fixed exactly when</text>
    <text x="635" y="365" font-size="29" font-weight="800" fill="#14766F">x = y.</text>
  </g>
</svg>
