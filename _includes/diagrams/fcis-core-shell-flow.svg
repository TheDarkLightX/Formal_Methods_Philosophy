<svg
  class="fp-diagram"
  viewBox="0 0 960 540"
  role="img"
  aria-labelledby="fcis-flow-title fcis-flow-desc"
  xmlns="http://www.w3.org/2000/svg"
>
  <title id="fcis-flow-title">Functional Core, Imperative Shell: value flow</title>
  <desc id="fcis-flow-desc">
    Untrusted bytes enter the shell, which parses them into bounded, canonical, authenticated values.
    Those values feed a pure transition function over State, Command, Policy, and Evidence.
    The transition returns either a Reject with a reason, or an Accept carrying the next state,
    an effect plan, and a receipt draft. The shell then atomically commits and delivers effects.
  </desc>

  <defs>
    <filter id="fcis-flow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <marker
      id="fcis-flow-arrow"
      markerWidth="12"
      markerHeight="12"
      refX="10"
      refY="6"
      orient="auto"
    >
      <path d="M0,0 L12,6 L0,12 Z" fill="#3B82F6" fill-opacity="0.9" />
    </marker>
    <marker
      id="fcis-flow-arrow-reject"
      markerWidth="12"
      markerHeight="12"
      refX="10"
      refY="6"
      orient="auto"
    >
      <path d="M0,0 L12,6 L0,12 Z" fill="#EF4444" fill-opacity="0.85" />
    </marker>
    <marker
      id="fcis-flow-arrow-accept"
      markerWidth="12"
      markerHeight="12"
      refX="10"
      refY="6"
      orient="auto"
    >
      <path d="M0,0 L12,6 L0,12 Z" fill="#10B981" fill-opacity="0.85" />
    </marker>
  </defs>

  <!-- Shell container (outer rounded rect) -->
  <rect x="24" y="24" width="912" height="492" rx="28" fill="rgba(15,23,42,0.02)" stroke="rgba(15,23,42,0.10)" stroke-width="2" />
  <text x="48" y="56" font-size="13" font-weight="900" fill="#475569" font-family="Atkinson Hyperlegible, system-ui, sans-serif" letter-spacing="1">
    IMPERATIVE SHELL
  </text>

  <!-- Core container (inner rounded rect) -->
  <rect x="220" y="180" width="520" height="220" rx="24" fill="#FFFFFF" stroke="rgba(59,130,246,0.25)" stroke-width="2" filter="url(#fcis-flow-shadow)" />
  <text x="244" y="208" font-size="13" font-weight="900" fill="#3B82F6" font-family="Atkinson Hyperlegible, system-ui, sans-serif" letter-spacing="1">
    FUNCTIONAL CORE
  </text>

  <!-- Input: untrusted bytes -->
  <rect x="60" y="100" width="200" height="56" rx="16" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.20)" />
  <text x="160" y="134" font-size="14" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    untrusted bytes
  </text>

  <!-- Arrow: bytes -> shell parse -->
  <path d="M160 156 V246" stroke="#3B82F6" stroke-width="3" marker-end="url(#fcis-flow-arrow)" stroke-linecap="round" />

  <!-- Bounded values box (inside shell, before core) -->
  <rect x="60" y="250" width="280" height="80" rx="18" fill="rgba(59,130,246,0.06)" stroke="rgba(59,130,246,0.18)" />
  <text x="200" y="278" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    bounded, canonical,
  </text>
  <text x="200" y="298" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    authenticated values
  </text>
  <text x="200" y="318" font-size="11" fill="#64748B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">
    State + Command + Policy + Evidence
  </text>

  <!-- Arrow: bounded values -> core transition -->
  <path d="M340 290 H400" stroke="#3B82F6" stroke-width="3" marker-end="url(#fcis-flow-arrow)" stroke-linecap="round" />

  <!-- Core transition function box -->
  <rect x="400" y="240" width="300" height="100" rx="18" fill="rgba(59,130,246,0.10)" stroke="rgba(59,130,246,0.30)" />
  <text x="550" y="270" font-size="14" font-weight="900" fill="#1E293B" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    pure transition
  </text>
  <text x="550" y="294" font-size="12" fill="#475569" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">
    transition(S, C, P, E) = D
  </text>
  <text x="550" y="318" font-size="11" fill="#64748B" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    deterministic, total, no I/O
  </text>

  <!-- Reject branch (upward) -->
  <path d="M550 240 V200 H820 V160" stroke="#EF4444" stroke-width="3" marker-end="url(#fcis-flow-arrow-reject)" stroke-linecap="round" fill="none" />
  <rect x="730" y="108" width="180" height="50" rx="14" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.20)" />
  <text x="820" y="138" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    Reject(reason)
  </text>

  <!-- Accept branch (downward) -->
  <path d="M550 340 V380 H820 V420" stroke="#10B981" stroke-width="3" marker-end="url(#fcis-flow-arrow-accept)" stroke-linecap="round" fill="none" />

  <!-- Accept box -->
  <rect x="660" y="420" width="260" height="80" rx="18" fill="rgba(16,185,129,0.08)" stroke="rgba(16,185,129,0.22)" />
  <text x="790" y="448" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    Accept
  </text>
  <text x="790" y="468" font-size="11" fill="#475569" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">
    next_state, effect_plan, receipt
  </text>

  <!-- Arrow: accept -> atomic commit -->
  <path d="M660 460 H504" stroke="#10B981" stroke-width="3" marker-end="url(#fcis-flow-arrow-accept)" stroke-linecap="round" />

  <!-- Atomic commit + deliver box -->
  <rect x="60" y="420" width="440" height="70" rx="18" fill="rgba(15,23,42,0.04)" stroke="rgba(15,23,42,0.12)" />
  <text x="280" y="448" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    atomic commit + idempotent effect delivery
  </text>
  <text x="280" y="468" font-size="11" fill="#64748B" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    compare-and-swap on state root, then deliver outbox
  </text>

  <!-- Boundary label on the core border -->
  <text x="480" y="172" font-size="11" font-weight="700" fill="#3B82F6" font-family="Atkinson Hyperlegible, system-ui, sans-serif" letter-spacing="0.5">
    value boundary
  </text>
  <line x1="440" y1="176" x2="520" y2="176" stroke="#3B82F6" stroke-width="1.5" stroke-dasharray="4 4" />
</svg>
