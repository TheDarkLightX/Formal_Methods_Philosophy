<svg class="fp-diagram" data-math-motion="true" viewBox="0 0 960 620" role="img" aria-labelledby="math-map-room-title math-map-room-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="math-map-room-title">The category theory map room</title>
  <desc id="math-map-room-desc">A source category contains an arrow from A to B. Two functors F and G both map that source category into the same destination category. In the destination, eta A and eta B connect the F images to the G images, forming a commuting naturality square. A lower panel illustrates Yoneda probes entering an object.</desc>
  <defs>
    <filter id="math-map-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.12" />
    </filter>
    <marker id="math-map-blue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#3f78bd" />
    </marker>
    <marker id="math-map-coral-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#df6658" />
    </marker>
    <marker id="math-map-purple-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#78529f" />
    </marker>
    <marker id="math-map-light-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#dbe8f8" />
    </marker>
  </defs>
  <style>
    .map-f-route, .map-g-route { stroke-dasharray: 8 10; }
    .map-natural-route { stroke-dasharray: 5 8; }
    .map-probe-route { stroke-dasharray: 4 8; }
    .math-motion-run .map-f-route { animation: map-route 0.7s linear 1 both; }
    .math-motion-run .map-g-route { animation: map-route 0.7s linear 0.75s 1 both; }
    .math-motion-run .map-natural-route { animation: map-route 0.7s linear 1.5s 1 both; }
    .math-motion-run .map-probe-route-1 { animation: map-route 0.45s linear 2.25s 1 both; }
    .math-motion-run .map-probe-route-2 { animation: map-route 0.45s linear 2.7s 1 both; }
    .math-motion-run .map-probe-route-3 { animation: map-route 0.45s linear 3.15s 1 both; }
    @keyframes map-route { from { stroke-dashoffset: 36; opacity: 0.4; } to { stroke-dashoffset: 0; opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .map-f-route, .map-g-route, .map-natural-route, .map-probe-route { animation: none; }
    }
  </style>

  <rect x="20" y="20" width="920" height="580" rx="34" fill="#fffaf2" stroke="#d8cdbd" stroke-width="2" />
  <text x="60" y="65" font-size="24" font-weight="800" fill="#172033" font-family="Atkinson Hyperlegible, system-ui, sans-serif">Two translators, one source, one destination</text>
  <text x="60" y="91" font-size="14" fill="#536076" font-family="Atkinson Hyperlegible, system-ui, sans-serif">Naturality says that translating and converting agree around the square.</text>

  <g filter="url(#math-map-shadow)">
    <rect x="58" y="126" width="254" height="254" rx="26" fill="#eaf3ff" stroke="#5b8dcc" stroke-width="2" />
    <rect x="510" y="110" width="392" height="286" rx="26" fill="#fff0e9" stroke="#df7666" stroke-width="2" />
  </g>

  <g font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    <text x="82" y="160" font-size="15" font-weight="800" fill="#315f9e">SOURCE CATEGORY C</text>
    <text x="534" y="144" font-size="15" font-weight="800" fill="#a6493e">DESTINATION CATEGORY D</text>

    <rect x="88" y="215" width="70" height="56" rx="12" fill="#ffffff" stroke="#5b8dcc" stroke-width="2" />
    <path d="M88 227 L123 197 L158 227" fill="#5b8dcc" />
    <text x="123" y="298" text-anchor="middle" font-size="15" font-weight="800" fill="#172033">A</text>
    <rect x="218" y="215" width="70" height="56" rx="12" fill="#ffffff" stroke="#5b8dcc" stroke-width="2" />
    <path d="M218 227 L253 197 L288 227" fill="#5b8dcc" />
    <text x="253" y="298" text-anchor="middle" font-size="15" font-weight="800" fill="#172033">B</text>
    <path d="M165 243 H209" fill="none" stroke="#3f78bd" stroke-width="3" marker-end="url(#math-map-blue-arrow)" />
    <text x="187" y="232" text-anchor="middle" font-size="13" font-weight="800" fill="#315f9e">f</text>
    <text x="82" y="344" font-size="13" fill="#536076">one source arrow: f : A → B</text>

    <rect x="548" y="174" width="72" height="48" rx="12" fill="#ffffff" stroke="#3f78bd" stroke-width="2" />
    <rect x="790" y="174" width="72" height="48" rx="12" fill="#ffffff" stroke="#3f78bd" stroke-width="2" />
    <text x="584" y="204" text-anchor="middle" font-size="14" font-weight="800" fill="#172033">F(A)</text>
    <text x="826" y="204" text-anchor="middle" font-size="14" font-weight="800" fill="#172033">F(B)</text>
    <path class="map-f-route" d="M628 198 H780" fill="none" stroke="#3f78bd" stroke-width="3" marker-end="url(#math-map-blue-arrow)" />
    <text x="704" y="187" text-anchor="middle" font-size="13" font-weight="800" fill="#315f9e">F(f)</text>

    <rect x="548" y="302" width="72" height="48" rx="12" fill="#ffffff" stroke="#df6658" stroke-width="2" />
    <rect x="790" y="302" width="72" height="48" rx="12" fill="#ffffff" stroke="#df6658" stroke-width="2" />
    <text x="584" y="332" text-anchor="middle" font-size="14" font-weight="800" fill="#172033">G(A)</text>
    <text x="826" y="332" text-anchor="middle" font-size="14" font-weight="800" fill="#172033">G(B)</text>
    <path class="map-g-route" d="M628 326 H780" fill="none" stroke="#df6658" stroke-width="3" marker-end="url(#math-map-coral-arrow)" />
    <text x="704" y="315" text-anchor="middle" font-size="13" font-weight="800" fill="#a6493e">G(f)</text>

    <path class="map-natural-route" d="M584 230 V292" fill="none" stroke="#78529f" stroke-width="3" marker-end="url(#math-map-purple-arrow)" />
    <path class="map-natural-route" d="M826 230 V292" fill="none" stroke="#78529f" stroke-width="3" marker-end="url(#math-map-purple-arrow)" />
    <text x="600" y="266" font-size="13" font-weight="800" fill="#69408f">η_A</text>
    <text x="842" y="266" font-size="13" font-weight="800" fill="#69408f">η_B</text>

    <path class="map-f-route" d="M322 184 H500" fill="none" stroke="#3f78bd" stroke-width="3" marker-end="url(#math-map-blue-arrow)" />
    <path class="map-g-route" d="M322 344 H500" fill="none" stroke="#df6658" stroke-width="3" marker-end="url(#math-map-coral-arrow)" />
    <text x="411" y="170" text-anchor="middle" font-size="13" font-weight="800" fill="#315f9e">functor F</text>
    <text x="411" y="366" text-anchor="middle" font-size="13" font-weight="800" fill="#a6493e">functor G</text>
  </g>

  <rect x="58" y="432" width="844" height="112" rx="24" fill="#172033" />
  <g font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    <g aria-hidden="true" fill="none" stroke="#ffd777" stroke-width="3">
      <circle cx="95" cy="462" r="12" />
      <path d="M104 471 L116 483" stroke-linecap="round" />
    </g>
    <text x="130" y="468" font-size="15" font-weight="800" fill="#ffd777">YONEDA PROBES</text>
    <circle cx="112" cy="490" r="14" fill="#65b487" />
    <circle cx="186" cy="510" r="14" fill="#5b8dcc" />
    <circle cx="260" cy="530" r="14" fill="#df7666" />
    <path class="map-probe-route map-probe-route-1" d="M130 490 C220 490 292 494 356 502" fill="none" stroke="#dbe8f8" stroke-width="2.5" marker-end="url(#math-map-light-arrow)" />
    <path class="map-probe-route map-probe-route-2" d="M204 510 H356" fill="none" stroke="#dbe8f8" stroke-width="2.5" marker-end="url(#math-map-light-arrow)" />
    <path class="map-probe-route map-probe-route-3" d="M278 530 C310 530 334 524 356 518" fill="none" stroke="#dbe8f8" stroke-width="2.5" marker-end="url(#math-map-light-arrow)" />
    <rect x="364" y="486" width="92" height="48" rx="15" fill="#fffaf2" />
    <text x="410" y="515" text-anchor="middle" font-size="15" font-weight="800" fill="#172033">object A</text>
    <text x="492" y="501" font-size="14" fill="#ffffff">Record every incoming map and every precomposition.</text>
    <text x="492" y="525" font-size="14" font-weight="800" fill="#ffd777">The complete pattern determines A up to isomorphism.</text>
  </g>
  <text x="480" y="574" text-anchor="middle" font-size="13" fill="#536076" font-family="Atkinson Hyperlegible, system-ui, sans-serif">The one-shot traces show reading order. The commuting-square equation states the naturality law.</text>
</svg>
