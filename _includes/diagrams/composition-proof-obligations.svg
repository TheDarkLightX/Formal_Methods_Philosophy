<svg
  class="fp-diagram"
  viewBox="0 0 960 480"
  role="img"
  aria-labelledby="fp-compose-title fp-compose-desc"
  xmlns="http://www.w3.org/2000/svg"
>
  <title id="fp-compose-title">Composition proof obligations</title>
  <desc id="fp-compose-desc">
    Two deterministic components enter a composition operator. Three gates check
    declared wiring, deterministic arbitration and merge, and closed external inputs.
    Passing all gates yields a right-unique composite. Hidden choice is diverted to
    a quarantine branch because deterministic parts alone are insufficient.
  </desc>

  <defs>
    <linearGradient id="fp-compose-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09131F" />
      <stop offset="1" stop-color="#17283A" />
    </linearGradient>
    <linearGradient id="fp-compose-op" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F59E0B" />
      <stop offset="1" stop-color="#D97706" />
    </linearGradient>
    <filter id="fp-compose-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.35" />
    </filter>
    <marker id="fp-compose-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#67E8F9" />
    </marker>
    <marker id="fp-compose-warn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#FB7185" />
    </marker>
  </defs>

  <rect x="18" y="18" width="924" height="444" rx="30" fill="url(#fp-compose-bg)" />
  <text x="50" y="61" fill="#F8FAFC" font-size="24" font-weight="900"
    font-family="Atkinson Hyperlegible, system-ui, sans-serif">The operator carries the preservation proof</text>
  <text x="50" y="89" fill="#AFC4D3" font-size="15"
    font-family="Atkinson Hyperlegible, system-ui, sans-serif">Right-unique parts are necessary. The middle gate decides whether they are sufficient.</text>

  <g font-family="Atkinson Hyperlegible, system-ui, sans-serif" filter="url(#fp-compose-shadow)">
    <rect x="52" y="142" width="190" height="88" rx="22" fill="#0F766E" />
    <text x="72" y="172" fill="#99F6E4" font-size="12" font-weight="900" letter-spacing="1.1">COMPONENT A</text>
    <text x="72" y="205" fill="#FFFFFF" font-size="18" font-weight="900">right-unique T₁</text>

    <rect x="52" y="254" width="190" height="88" rx="22" fill="#155E75" />
    <text x="72" y="284" fill="#BAE6FD" font-size="12" font-weight="900" letter-spacing="1.1">COMPONENT B</text>
    <text x="72" y="317" fill="#FFFFFF" font-size="18" font-weight="900">right-unique T₂</text>
  </g>

  <path d="M250 186 H314" stroke="#67E8F9" stroke-width="4" marker-end="url(#fp-compose-arrow)" />
  <path d="M250 298 H314" stroke="#67E8F9" stroke-width="4" marker-end="url(#fp-compose-arrow)" />

  <g filter="url(#fp-compose-shadow)">
    <rect x="330" y="126" width="302" height="238" rx="28" fill="url(#fp-compose-op)" />
  </g>
  <g font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    <text x="356" y="162" fill="#FFF7ED" font-size="12" font-weight="900" letter-spacing="1.3">COMPOSITION OPERATOR ⊗</text>
    <g transform="translate(354 183)">
      <rect width="254" height="43" rx="12" fill="#7C2D12" fill-opacity="0.28" stroke="#FED7AA" stroke-opacity="0.7" />
      <circle cx="22" cy="21.5" r="9" fill="#ECFDF5" />
      <path d="M17 21 L21 25 L28 17" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="42" y="27" fill="#FFFFFF" font-size="15" font-weight="800">declared wiring</text>
    </g>
    <g transform="translate(354 237)">
      <rect width="254" height="43" rx="12" fill="#7C2D12" fill-opacity="0.28" stroke="#FED7AA" stroke-opacity="0.7" />
      <circle cx="22" cy="21.5" r="9" fill="#ECFDF5" />
      <path d="M17 21 L21 25 L28 17" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="42" y="27" fill="#FFFFFF" font-size="15" font-weight="800">fixed arbitration + merge</text>
    </g>
    <g transform="translate(354 291)">
      <rect width="254" height="43" rx="12" fill="#7C2D12" fill-opacity="0.28" stroke="#FED7AA" stroke-opacity="0.7" />
      <circle cx="22" cy="21.5" r="9" fill="#ECFDF5" />
      <path d="M17 21 L21 25 L28 17" fill="none" stroke="#047857" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      <text x="42" y="27" fill="#FFFFFF" font-size="15" font-weight="800">closed external inputs</text>
    </g>
  </g>

  <path d="M646 232 H702" stroke="#67E8F9" stroke-width="4" marker-end="url(#fp-compose-arrow)" />
  <g filter="url(#fp-compose-shadow)" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    <rect x="718" y="173" width="190" height="118" rx="24" fill="#ECFDF5" />
    <text x="742" y="205" fill="#047857" font-size="12" font-weight="900" letter-spacing="1.1">PRESERVED</text>
    <text x="742" y="239" fill="#0F172A" font-size="18" font-weight="900">T₁ ⊗ T₂</text>
    <text x="742" y="266" fill="#334155" font-size="15" font-weight="700">is right-unique</text>
  </g>

  <path d="M481 370 V402 H694" stroke="#FB7185" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#fp-compose-warn-arrow)" />
  <g font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    <rect x="710" y="374" width="198" height="58" rx="17" fill="#4C1825" stroke="#FB7185" />
    <text x="731" y="398" fill="#FECDD3" font-size="12" font-weight="900" letter-spacing="1">QUARANTINE</text>
    <text x="731" y="420" fill="#FFFFFF" font-size="14" font-weight="700">hidden choice remains</text>
    <text x="52" y="420" fill="#FCA5A5" font-size="14" font-weight="700">Any failed gate blocks the conclusion.</text>
  </g>
</svg>
