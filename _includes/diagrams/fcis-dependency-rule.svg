<svg
  class="fp-diagram"
  viewBox="0 0 720 280"
  role="img"
  aria-labelledby="fcis-dep-title fcis-dep-desc"
  xmlns="http://www.w3.org/2000/svg"
>
  <title id="fcis-dep-title">FCIS dependency rule</title>
  <desc id="fcis-dep-desc">
    The shell may depend on core modules: model, invariants, transition, codec, and commitment.
    The core must not depend on the shell. This one-way dependency keeps semantic rules
    free of database, network, clock, and filesystem knowledge.
  </desc>

  <defs>
    <filter id="fcis-dep-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.08" />
    </filter>
    <marker
      id="fcis-dep-arrow-ok"
      markerWidth="12"
      markerHeight="12"
      refX="10"
      refY="6"
      orient="auto"
    >
      <path d="M0,0 L12,6 L0,12 Z" fill="#3B82F6" fill-opacity="0.9" />
    </marker>
  </defs>

  <!-- Shell box (left) -->
  <rect x="40" y="60" width="240" height="160" rx="22" fill="#FFFFFF" stroke="rgba(15,23,42,0.12)" stroke-width="2" filter="url(#fcis-dep-shadow)" />
  <text x="160" y="92" font-size="15" font-weight="900" fill="#1E293B" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    Shell
  </text>
  <text x="160" y="114" font-size="11" fill="#64748B" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    auth, storage, I/O,
  </text>
  <text x="160" y="130" font-size="11" fill="#64748B" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    atomic commit, delivery
  </text>

  <!-- Core box (right) -->
  <rect x="440" y="60" width="240" height="160" rx="22" fill="rgba(59,130,246,0.06)" stroke="rgba(59,130,246,0.25)" stroke-width="2" filter="url(#fcis-dep-shadow)" />
  <text x="560" y="92" font-size="15" font-weight="900" fill="#3B82F6" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    Core
  </text>
  <text x="560" y="114" font-size="11" fill="#475569" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    model, invariants,
  </text>
  <text x="560" y="130" font-size="11" fill="#475569" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    transition, codec,
  </text>
  <text x="560" y="146" font-size="11" fill="#475569" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    commitment
  </text>

  <!-- Allowed arrow: shell -> core -->
  <path d="M280 120 H436" stroke="#3B82F6" stroke-width="4" marker-end="url(#fcis-dep-arrow-ok)" stroke-linecap="round" />
  <text x="358" y="108" font-size="12" font-weight="700" fill="#3B82F6" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    depends on
  </text>

  <!-- Forbidden arrow: core -> shell (dashed, red, with X) -->
  <path d="M440 180 H284" stroke="#EF4444" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round" />
  <text x="358" y="196" font-size="12" font-weight="700" fill="#EF4444" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    forbidden
  </text>
  <!-- X mark on the forbidden arrow -->
  <g transform="translate(358, 168)">
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
    <line x1="-8" y1="8" x2="8" y2="-8" stroke="#EF4444" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
