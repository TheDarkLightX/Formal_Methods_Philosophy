<svg
  class="fp-diagram"
  viewBox="0 0 960 500"
  role="img"
  aria-labelledby="fp-kahn-title fp-kahn-desc"
  xmlns="http://www.w3.org/2000/svg"
>
  <title id="fp-kahn-title">Kahn network schedule independence</title>
  <desc id="fp-kahn-desc">
    Two fair schedules run the same deterministic process network at different speeds.
    Tokens move at different times, while both schedules produce the same FIFO output
    history 2, 4, 6. A lower panel states the least-fixed-point semantics and lists
    termination, deadlock freedom, and bounded memory as separate claims.
  </desc>

  <defs>
    <linearGradient id="fp-kahn-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF5" />
      <stop offset="1" stop-color="#F3F8F7" />
    </linearGradient>
    <filter id="fp-kahn-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
    <marker id="fp-kahn-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0F766E" />
    </marker>
    <style>
      .fp-kahn-static-token { display: none; }
      @media (prefers-reduced-motion: reduce) {
        .fp-kahn-animated-token { display: none; }
        .fp-kahn-static-token { display: inline; }
      }
    </style>
  </defs>

  <rect x="18" y="18" width="924" height="464" rx="30" fill="url(#fp-kahn-bg)" stroke="#D9E4E2" />
  <text x="48" y="60" fill="#0F172A" font-size="24" font-weight="900"
    font-family="Atkinson Hyperlegible, system-ui, sans-serif">Different clocks, one stream denotation</text>
  <text x="48" y="88" fill="#52656D" font-size="15"
    font-family="Atkinson Hyperlegible, system-ui, sans-serif">Fair scheduling changes progress, not the FIFO histories selected by the model.</text>

  <g font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    <g transform="translate(48 116)">
      <rect width="864" height="112" rx="20" fill="#FFFFFF" stroke="#D7E3E0" filter="url(#fp-kahn-shadow)" />
      <text x="20" y="28" fill="#B45309" font-size="12" font-weight="900" letter-spacing="1.2">SCHEDULE A · PRODUCER RUNS EARLY</text>
      <g transform="translate(182 48)">
        <rect width="100" height="46" rx="14" fill="#0F766E" />
        <text x="50" y="29" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="900">P₁</text>
        <path d="M108 23 H252" stroke="#0F766E" stroke-width="3" marker-end="url(#fp-kahn-arrow)" />
        <rect x="268" width="100" height="46" rx="14" fill="#164E63" />
        <text x="318" y="29" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="900">P₂</text>
        <path d="M376 23 H520" stroke="#0F766E" stroke-width="3" marker-end="url(#fp-kahn-arrow)" />
        <rect x="536" width="124" height="46" rx="14" fill="#ECFDF5" stroke="#0F766E" />
        <text x="598" y="29" text-anchor="middle" fill="#065F46" font-size="15" font-weight="900">[2, 4, 6]</text>
        <circle class="fp-kahn-animated-token" r="8" fill="#F59E0B">
          <animateMotion dur="3.4s" repeatCount="indefinite" path="M110 23 H250" />
        </circle>
        <circle class="fp-kahn-animated-token" r="8" fill="#14B8A6">
          <animateMotion begin="0.7s" dur="2.4s" repeatCount="indefinite" path="M378 23 H518" />
        </circle>
        <g class="fp-kahn-static-token">
          <circle cx="178" cy="23" r="8" fill="#F59E0B" />
          <circle cx="446" cy="23" r="8" fill="#14B8A6" />
        </g>
      </g>
    </g>

    <g transform="translate(48 244)">
      <rect width="864" height="112" rx="20" fill="#FFFFFF" stroke="#D7E3E0" filter="url(#fp-kahn-shadow)" />
      <text x="20" y="28" fill="#0369A1" font-size="12" font-weight="900" letter-spacing="1.2">SCHEDULE B · CONSUMER RUNS LATE</text>
      <g transform="translate(182 48)">
        <rect width="100" height="46" rx="14" fill="#0F766E" />
        <text x="50" y="29" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="900">P₁</text>
        <path d="M108 23 H252" stroke="#0F766E" stroke-width="3" marker-end="url(#fp-kahn-arrow)" />
        <rect x="268" width="100" height="46" rx="14" fill="#164E63" />
        <text x="318" y="29" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="900">P₂</text>
        <path d="M376 23 H520" stroke="#0F766E" stroke-width="3" marker-end="url(#fp-kahn-arrow)" />
        <rect x="536" width="124" height="46" rx="14" fill="#ECFDF5" stroke="#0F766E" />
        <text x="598" y="29" text-anchor="middle" fill="#065F46" font-size="15" font-weight="900">[2, 4, 6]</text>
        <circle class="fp-kahn-animated-token" r="8" fill="#F59E0B">
          <animateMotion dur="2.1s" repeatCount="indefinite" path="M110 23 H250" />
        </circle>
        <circle class="fp-kahn-animated-token" r="8" fill="#14B8A6">
          <animateMotion begin="1.5s" dur="4.1s" repeatCount="indefinite" path="M378 23 H518" />
        </circle>
        <g class="fp-kahn-static-token">
          <circle cx="178" cy="23" r="8" fill="#F59E0B" />
          <circle cx="446" cy="23" r="8" fill="#14B8A6" />
        </g>
      </g>
    </g>
  </g>

  <g transform="translate(48 382)" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    <rect width="530" height="72" rx="18" fill="#082F49" />
    <text x="22" y="28" fill="#BAE6FD" font-size="12" font-weight="900" letter-spacing="1.1">DENOTATION</text>
    <text x="22" y="54" fill="#FFFFFF" font-size="18" font-weight="800">⟦N⟧(I) = lfp(Φ<tspan baseline-shift="sub" font-size="13">I</tspan>)</text>

    <rect x="548" width="316" height="72" rx="18" fill="#FFF7ED" stroke="#FDBA74" />
    <text x="568" y="25" fill="#9A3412" font-size="12" font-weight="900" letter-spacing="1">NOT IMPLIED</text>
    <text x="568" y="50" fill="#7C2D12" font-size="14">termination · deadlock freedom · bounded queues</text>
  </g>
</svg>
