<svg
  class="fp-diagram"
  viewBox="0 0 1200 520"
  role="img"
  aria-labelledby="glassmind-compiler-title glassmind-compiler-desc"
  xmlns="http://www.w3.org/2000/svg"
>
  <title id="glassmind-compiler-title">GlassMind proof-carrying knowledge compiler</title>
  <desc id="glassmind-compiler-desc">
    A pinned knowledge source is canonicalized, filtered through a deontic
    action mask, ranked by a declared utility model, compiled into layered Q
    values, and checked by replay. Counterexamples return to the proposal lane.
  </desc>
  <defs>
    <linearGradient id="gm-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6" stop-opacity="0.20" />
      <stop offset="1" stop-color="#3B82F6" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="gm-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.20" />
      <stop offset="1" stop-color="#F97316" stop-opacity="0.04" />
    </linearGradient>
    <filter id="gm-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.12" />
    </filter>
    <marker id="gm-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6" />
    </marker>
    <marker id="gm-return-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F97316" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="520" rx="24" fill="transparent" />

  <g filter="url(#gm-shadow)" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    <rect x="35" y="96" width="185" height="210" rx="20" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="58" y="134" font-size="16" font-weight="800" fill="#1E293B">Sources</text>
    <text x="58" y="163" font-size="12" fill="#475569">pinned WordNet release</text>
    <text x="58" y="187" font-size="12" fill="#475569">LLM seed proposals</text>
    <text x="58" y="211" font-size="12" fill="#475569">measured outcomes</text>
    <rect x="58" y="241" width="138" height="34" rx="10" fill="url(#gm-orange)" stroke="#FED7AA" />
    <text x="73" y="263" font-size="12" font-weight="700" fill="#9A3412">untrusted inputs</text>

    <rect x="270" y="96" width="185" height="210" rx="20" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="293" y="134" font-size="16" font-weight="800" fill="#1E293B">Canonical facts</text>
    <text x="293" y="163" font-size="12" fill="#475569">bounded parser</text>
    <text x="293" y="187" font-size="12" fill="#475569">stable node keys</text>
    <text x="293" y="211" font-size="12" fill="#475569">content hashes</text>
    <rect x="293" y="241" width="138" height="34" rx="10" fill="url(#gm-blue)" stroke="#BFDBFE" />
    <text x="308" y="263" font-size="12" font-weight="700" fill="#1E40AF">facts, not norms</text>

    <rect x="505" y="96" width="185" height="210" rx="20" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="528" y="134" font-size="16" font-weight="800" fill="#1E293B">Deontic gate</text>
    <text x="528" y="163" font-size="12" fill="#475569">obligatory O(a)</text>
    <text x="528" y="187" font-size="12" fill="#475569">forbidden F(a)</text>
    <text x="528" y="211" font-size="12" fill="#475569">permitted P(a)</text>
    <rect x="528" y="241" width="138" height="34" rx="10" fill="url(#gm-orange)" stroke="#FED7AA" />
    <text x="543" y="263" font-size="12" font-weight="700" fill="#9A3412">unknown: abstain</text>

    <rect x="740" y="96" width="185" height="210" rx="20" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="763" y="134" font-size="16" font-weight="800" fill="#1E293B">Q compiler</text>
    <text x="763" y="163" font-size="12" fill="#475569">declared utility</text>
    <text x="763" y="187" font-size="12" fill="#475569">Bellman recurrence</text>
    <text x="763" y="211" font-size="12" fill="#475569">256 horizon layers</text>
    <rect x="763" y="241" width="138" height="34" rx="10" fill="url(#gm-blue)" stroke="#BFDBFE" />
    <text x="778" y="263" font-size="12" font-weight="700" fill="#1E40AF">50 MiB / 512 MiB</text>

    <rect x="975" y="96" width="190" height="210" rx="20" fill="#FFFFFF" stroke="#E2E8F0" />
    <text x="998" y="134" font-size="16" font-weight="800" fill="#1E293B">Replay receipt</text>
    <text x="998" y="163" font-size="12" fill="#475569">all Q cells checked</text>
    <text x="998" y="187" font-size="12" fill="#475569">forbidden choices: 0</text>
    <text x="998" y="211" font-size="12" fill="#475569">hash-bound reasons</text>
    <rect x="998" y="241" width="143" height="34" rx="10" fill="url(#gm-blue)" stroke="#BFDBFE" />
    <text x="1013" y="263" font-size="12" font-weight="700" fill="#1E40AF">checked finite scope</text>
  </g>

  <g stroke="#3B82F6" stroke-width="4" fill="none" marker-end="url(#gm-arrow)" stroke-linecap="round">
    <path d="M225 201 H260" />
    <path d="M460 201 H495" />
    <path d="M695 201 H730" />
    <path d="M930 201 H965" />
  </g>

  <path
    d="M1070 326 C1070 432, 140 432, 140 326"
    stroke="#F97316"
    stroke-width="4"
    stroke-dasharray="9 8"
    fill="none"
    marker-end="url(#gm-return-arrow)"
    stroke-linecap="round"
  />
  <text x="440" y="405" font-size="14" font-weight="700" fill="#9A3412" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    counterexample, conflict, or sparse region becomes the next proposal target
  </text>
  <text x="395" y="470" font-size="12" fill="#475569" font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    Proposal scales through language models. Acceptance stays deterministic and replayable.
  </text>
</svg>
