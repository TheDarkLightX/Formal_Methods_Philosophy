<svg class="fp-diagram" data-math-motion="true" viewBox="0 0 960 590" role="img" aria-labelledby="math-structure-machine-title math-structure-machine-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="math-structure-machine-title">The algebraic structure machine</title>
  <desc id="math-structure-machine-desc">Objects enter a combining machine. The result must stay in the same world. Four optional promise cards add associativity, identity, inverses, and commutativity, producing the ladder from magma to abelian group.</desc>
  <defs>
    <filter id="math-machine-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.12" />
    </filter>
    <marker id="math-machine-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#22314f" />
    </marker>
  </defs>
  <style>
    .machine-flow { stroke-dasharray: 6 9; }
    .machine-law { opacity: 1; }
    .math-motion-run .machine-law { animation: machine-law-enter 0.45s ease-out 1 both; }
    .math-motion-run .machine-law-1 { animation-delay: 0.4s; }
    .math-motion-run .machine-law-2 { animation-delay: 0.9s; }
    .math-motion-run .machine-law-3 { animation-delay: 1.4s; }
    .math-motion-run .machine-law-4 { animation-delay: 1.9s; }
    @keyframes machine-law-enter { from { opacity: 0.42; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .machine-law { animation: none; }
      .machine-law { opacity: 1; }
    }
  </style>
  <rect x="20" y="20" width="920" height="550" rx="34" fill="#f8fbff" stroke="#c8d6e8" stroke-width="2" />
  <text x="60" y="68" font-size="24" font-weight="800" fill="#172033" font-family="Atkinson Hyperlegible, system-ui, sans-serif">The same toy, upgraded by promises</text>
  <text x="60" y="94" font-size="14" fill="#536076" font-family="Atkinson Hyperlegible, system-ui, sans-serif">The names change only when the machine earns another law.</text>

  <g filter="url(#math-machine-shadow)">
    <rect x="66" y="140" width="214" height="184" rx="24" fill="#fff7dc" stroke="#e5ae42" stroke-width="2" />
    <rect x="344" y="126" width="272" height="212" rx="30" fill="#173252" stroke="#0e2239" stroke-width="3" />
    <rect x="680" y="140" width="214" height="184" rx="24" fill="#eaf8ef" stroke="#58a879" stroke-width="2" />
  </g>

  <g font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    <text x="92" y="174" font-size="14" font-weight="800" fill="#8c5711">CARRIER A</text>
    <circle cx="119" cy="226" r="22" fill="#ef6a5b" />
    <rect x="153" y="204" width="44" height="44" rx="10" fill="#4a86cf" />
    <path d="M231 202 L255 246 H207 Z" fill="#50a978" />
    <text x="92" y="286" font-size="14" fill="#536076">The carrier is the</text>
    <text x="92" y="306" font-size="14" fill="#536076">world of allowed things.</text>

    <text x="382" y="166" font-size="14" font-weight="800" fill="#ffd777">OPERATION ◇</text>
    <circle cx="414" cy="222" r="22" fill="#ef6a5b" />
    <text x="455" y="230" font-size="28" font-weight="800" fill="#ffd777">◇</text>
    <rect x="503" y="200" width="44" height="44" rx="10" fill="#4a86cf" />
    <path d="M404 275 H548" stroke="#dbe8f8" stroke-width="3" marker-end="url(#math-machine-arrow)" />
    <path d="M556 254 L580 298 H532 Z" fill="#50a978" />
    <text x="382" y="320" font-size="14" fill="#dbe8f8">CLOSURE: a ◇ b ∈ A</text>

    <text x="706" y="174" font-size="14" font-weight="800" fill="#24704a">LAW CARDS</text>
    <text class="machine-law machine-law-1" x="706" y="212" font-size="14" fill="#172033">ASSOCIATIVE: regroup</text>
    <text class="machine-law machine-law-2" x="706" y="241" font-size="12" fill="#172033">IDENTITY: a ◇ e = a = e ◇ a</text>
    <text class="machine-law machine-law-3" x="706" y="270" font-size="12" fill="#172033">INVERSE: a ◇ a⁻¹ = e = a⁻¹ ◇ a</text>
    <text class="machine-law machine-law-4" x="706" y="299" font-size="14" fill="#172033">COMMUTATIVE: swap safely</text>
  </g>

  <path class="machine-flow" d="M280 232 H334" stroke="#22314f" stroke-width="3" marker-end="url(#math-machine-arrow)" />
  <path class="machine-flow" d="M626 232 H670" stroke="#22314f" stroke-width="3" marker-end="url(#math-machine-arrow)" />

  <text x="60" y="392" font-size="16" font-weight="800" fill="#172033" font-family="Atkinson Hyperlegible, system-ui, sans-serif">Name earned after each promise</text>
  <g font-family="Atkinson Hyperlegible, system-ui, sans-serif" font-size="14" text-anchor="middle">
    <rect x="58" y="420" width="146" height="76" rx="18" fill="#fff" stroke="#9aacbf" stroke-width="2" />
    <text x="131" y="448" font-weight="800" fill="#172033">MAGMA</text>
    <text x="131" y="473" fill="#536076">one closed button</text>

    <rect x="230" y="420" width="146" height="76" rx="18" fill="#fff" stroke="#cb8e35" stroke-width="2" />
    <text x="303" y="448" font-weight="800" fill="#172033">SEMIGROUP</text>
    <text x="303" y="473" fill="#536076">+ associative</text>

    <rect x="402" y="420" width="146" height="76" rx="18" fill="#fff" stroke="#4d86ca" stroke-width="2" />
    <text x="475" y="448" font-weight="800" fill="#172033">MONOID</text>
    <text x="475" y="473" fill="#536076">+ identity e</text>

    <rect x="574" y="420" width="146" height="76" rx="18" fill="#fff" stroke="#55a579" stroke-width="2" />
    <text x="647" y="448" font-weight="800" fill="#172033">GROUP</text>
    <text x="647" y="473" fill="#536076">+ inverses</text>

    <rect x="746" y="420" width="156" height="76" rx="18" fill="#fff" stroke="#8b62b3" stroke-width="2" />
    <text x="824" y="448" font-weight="800" fill="#172033">ABELIAN GROUP</text>
    <text x="824" y="473" fill="#536076">+ commutative</text>
  </g>
  <g fill="none" stroke="#22314f" stroke-width="3" marker-end="url(#math-machine-arrow)">
    <path d="M204 458 H220" />
    <path d="M376 458 H392" />
    <path d="M548 458 H564" />
    <path d="M720 458 H736" />
  </g>
  <rect x="226" y="522" width="508" height="30" rx="15" fill="#e7eef7" />
  <text x="480" y="542" text-anchor="middle" font-size="13" font-weight="700" fill="#34445d" font-family="Atkinson Hyperlegible, system-ui, sans-serif">The arrows mean “add this law,” not “prove every structure lies on one ladder.”</text>
</svg>
