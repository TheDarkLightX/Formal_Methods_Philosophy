<svg class="fp-diagram" data-math-motion="true" viewBox="0 0 960 560" role="img" aria-labelledby="math-proof-ladder-title math-proof-ladder-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="math-proof-ladder-title">Four ways to meet one plus one equals two</title>
  <desc id="math-proof-ladder-desc">A storybook path from two apples, through a successor machine, to a finite proof certificate, and finally an independent checker. The diagram distinguishes seeing, explaining, proving, and checking.</desc>
  <defs>
    <filter id="math-proof-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.12" />
    </filter>
    <marker id="math-proof-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22314f" />
    </marker>
  </defs>
  <style>
    .proof-room { opacity: 1; }
    .proof-route { stroke-dasharray: 5 8; }
    .proof-checkmark { stroke-dasharray: 38; stroke-dashoffset: 0; }
    .math-motion-run .proof-room { animation: proof-room-enter 0.65s ease-out 1 both; }
    .math-motion-run .proof-room-2 { animation-delay: 0.65s; }
    .math-motion-run .proof-room-3 { animation-delay: 1.3s; }
    .math-motion-run .proof-room-4 { animation-delay: 1.95s; }
    .math-motion-run .proof-route { animation: proof-route-flow 2.6s linear 1 both; }
    .math-motion-run .proof-checkmark { animation: proof-check-draw 0.65s ease-out 2.6s 1 both; }
    @keyframes proof-room-enter { from { opacity: 0.5; } to { opacity: 1; } }
    @keyframes proof-route-flow { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -52; } }
    @keyframes proof-check-draw { from { stroke-dashoffset: 38; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .proof-room, .proof-route, .proof-checkmark { animation: none; }
      .proof-room { opacity: 1; }
      .proof-checkmark { stroke-dashoffset: 0; }
    }
  </style>

  <rect x="20" y="20" width="920" height="520" rx="34" fill="#fffaf0" stroke="#d8cbb8" stroke-width="2" />
  <path d="M72 104 H888" stroke="#eadfcd" stroke-width="2" stroke-dasharray="6 10" />
  <text x="64" y="66" font-size="24" font-weight="800" fill="#172033" font-family="Atkinson Hyperlegible, system-ui, sans-serif">One claim, four different jobs</text>
  <text x="64" y="92" font-size="14" fill="#536076" font-family="Atkinson Hyperlegible, system-ui, sans-serif">Each room answers a deeper question. None of the rooms can silently replace another.</text>

  <g filter="url(#math-proof-shadow)">
    <rect class="proof-room proof-room-1" x="56" y="142" width="190" height="270" rx="24" fill="#fff3d6" stroke="#e9ad42" stroke-width="2" />
    <rect class="proof-room proof-room-2" x="272" y="142" width="190" height="270" rx="24" fill="#e9f7ef" stroke="#55a97a" stroke-width="2" />
    <rect class="proof-room proof-room-3" x="488" y="142" width="190" height="270" rx="24" fill="#eaf2ff" stroke="#5386cf" stroke-width="2" />
    <rect class="proof-room proof-room-4" x="704" y="142" width="190" height="270" rx="24" fill="#f6edff" stroke="#9467bd" stroke-width="2" />
  </g>

  <g font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    <text x="78" y="176" font-size="14" font-weight="800" fill="#8c5711">1 · SEE</text>
    <text x="78" y="208" font-size="20" font-weight="800" fill="#172033">Picture</text>
    <g class="proof-apples" aria-hidden="true">
      <circle cx="116" cy="260" r="25" fill="#e7463f" />
      <circle cx="184" cy="260" r="25" fill="#e7463f" />
      <path d="M116 235 Q119 220 131 216" fill="none" stroke="#347451" stroke-width="6" stroke-linecap="round" />
      <path d="M184 235 Q187 220 199 216" fill="none" stroke="#347451" stroke-width="6" stroke-linecap="round" />
      <text x="145" y="268" font-size="24" font-weight="800" fill="#8c5711">+</text>
    </g>
    <text x="78" y="318" font-size="15" font-weight="700" fill="#172033">“I can see two.”</text>
    <text x="78" y="345" font-size="13" fill="#536076">Good intuition.</text>
    <text x="78" y="365" font-size="13" fill="#536076">Not yet a formal route.</text>

    <text x="294" y="176" font-size="14" font-weight="800" fill="#24704a">2 · EXPLAIN</text>
    <text x="294" y="208" font-size="20" font-weight="800" fill="#172033">Number machine</text>
    <circle cx="318" cy="258" r="19" fill="#ffffff" stroke="#24704a" stroke-width="3" />
    <text x="312" y="265" font-size="18" font-weight="800" fill="#24704a">0</text>
    <path d="M343 258 H385" fill="none" stroke="#24704a" stroke-width="3" marker-end="url(#math-proof-arrow)" />
    <rect x="395" y="237" width="42" height="42" rx="12" fill="#ffffff" stroke="#24704a" stroke-width="3" />
    <text x="407" y="265" font-size="18" font-weight="800" fill="#24704a">S</text>
    <text x="294" y="318" font-size="15" font-weight="700" fill="#172033">“S means next.”</text>
    <text x="294" y="345" font-size="13" fill="#536076">1 = S(0)</text>
    <text x="294" y="365" font-size="13" fill="#536076">2 = S(S(0))</text>

    <text x="510" y="176" font-size="14" font-weight="800" fill="#315f9e">3 · PROVE</text>
    <text x="510" y="208" font-size="20" font-weight="800" fill="#172033">Licensed steps</text>
    <rect x="516" y="230" width="134" height="92" rx="14" fill="#ffffff" stroke="#5386cf" stroke-width="2" />
    <path d="M532 252 H634 M532 273 H620 M532 294 H640" stroke="#8aaad7" stroke-width="4" stroke-linecap="round" />
    <circle cx="630" cy="342" r="17" fill="#5386cf" />
      <path class="proof-checkmark" d="M621 342 L628 349 L641 334" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="510" y="379" font-size="13" fill="#536076">A finite certificate</text>
    <text x="510" y="399" font-size="13" fill="#536076">records every legal move.</text>

    <text x="726" y="176" font-size="14" font-weight="800" fill="#71439a">4 · CHECK</text>
    <text x="726" y="208" font-size="20" font-weight="800" fill="#172033">Proof checker</text>
    <g aria-hidden="true">
      <rect x="748" y="232" width="102" height="92" rx="22" fill="#ffffff" stroke="#9467bd" stroke-width="3" />
      <circle cx="778" cy="270" r="8" fill="#9467bd" />
      <circle cx="820" cy="270" r="8" fill="#9467bd" />
      <path d="M778 300 Q799 315 820 300" fill="none" stroke="#9467bd" stroke-width="4" stroke-linecap="round" />
      <path d="M799 232 V215" stroke="#9467bd" stroke-width="4" />
      <circle cx="799" cy="208" r="7" fill="#e9ad42" />
    </g>
    <text x="716" y="354" font-size="14" font-weight="700" fill="#172033">Independently replayable.</text>
    <text x="726" y="381" font-size="13" fill="#536076">Replay the public rules.</text>
    <text x="726" y="401" font-size="13" fill="#536076">Accept or reject.</text>
  </g>

  <g class="proof-route" fill="none" stroke="#22314f" stroke-width="3" marker-end="url(#math-proof-arrow)">
    <path d="M246 276 H264" />
    <path d="M462 276 H480" />
    <path d="M678 276 H696" />
  </g>

  <rect x="170" y="450" width="620" height="58" rx="18" fill="#172033" />
  <text x="480" y="476" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff" font-family="Atkinson Hyperlegible, system-ui, sans-serif">ANSWER ≠ EXPLANATION ≠ PROOF ≠ CHECK</text>
  <text x="480" y="497" text-anchor="middle" font-size="13" fill="#dce6f7" font-family="Atkinson Hyperlegible, system-ui, sans-serif">They may support one another, but they answer different questions.</text>
</svg>
