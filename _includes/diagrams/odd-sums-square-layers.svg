<svg class="fp-diagram" viewBox="0 0 900 430" role="img" aria-labelledby="odd-square-title odd-square-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="odd-square-title">A square built from consecutive odd-sized layers</title>
  <desc id="odd-square-desc">A four by four square is colored in four nested L-shaped layers containing one, three, five, and seven cells. Each layer grows a square of side k minus one into a square of side k.</desc>
  <rect x="8" y="8" width="884" height="414" rx="22" fill="#fffdf8" stroke="#d8cdb9" stroke-width="2"/>
  <text x="450" y="48" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="800" letter-spacing="1.2" fill="#17324d">EACH NEW SQUARE ADDS ONE ODD-SIZED LAYER</text>

  <!-- Layer 4: seven cells -->
  <g fill="#d9eaf0" stroke="#fffdf8" stroke-width="3">
    <rect x="102" y="85" width="58" height="58"/><rect x="160" y="85" width="58" height="58"/><rect x="218" y="85" width="58" height="58"/><rect x="276" y="85" width="58" height="58"/>
    <rect x="276" y="143" width="58" height="58"/><rect x="276" y="201" width="58" height="58"/><rect x="276" y="259" width="58" height="58"/>
  </g>
  <!-- Layer 3: five cells -->
  <g fill="#b9ddd3" stroke="#fffdf8" stroke-width="3">
    <rect x="102" y="143" width="58" height="58"/><rect x="160" y="143" width="58" height="58"/><rect x="218" y="143" width="58" height="58"/>
    <rect x="218" y="201" width="58" height="58"/><rect x="218" y="259" width="58" height="58"/>
  </g>
  <!-- Layer 2: three cells -->
  <g fill="#f1d79d" stroke="#fffdf8" stroke-width="3">
    <rect x="102" y="201" width="58" height="58"/><rect x="160" y="201" width="58" height="58"/><rect x="160" y="259" width="58" height="58"/>
  </g>
  <!-- Layer 1: one cell -->
  <rect x="102" y="259" width="58" height="58" fill="#dba79d" stroke="#fffdf8" stroke-width="3"/>
  <rect x="102" y="85" width="232" height="232" fill="none" stroke="#17324d" stroke-width="3"/>

  <text x="218" y="349" text-anchor="middle" font-family="Georgia, serif" font-size="25" fill="#17324d">1 + 3 + 5 + 7 = 4²</text>
  <text x="218" y="382" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#5a6570">sixteen unit cells, grouped by growth step</text>

  <line x1="391" y1="83" x2="391" y2="339" stroke="#d8cdb9" stroke-width="2"/>

  <g font-family="system-ui, sans-serif">
    <rect x="442" y="93" width="32" height="32" rx="6" fill="#dba79d"/>
    <text x="492" y="116" font-size="18" font-weight="750" fill="#17324d">layer 1 has 1 cell</text>

    <rect x="442" y="153" width="32" height="32" rx="6" fill="#f1d79d"/>
    <text x="492" y="176" font-size="18" font-weight="750" fill="#17324d">layer 2 has 3 cells</text>

    <rect x="442" y="213" width="32" height="32" rx="6" fill="#b9ddd3"/>
    <text x="492" y="236" font-size="18" font-weight="750" fill="#17324d">layer 3 has 5 cells</text>

    <rect x="442" y="273" width="32" height="32" rx="6" fill="#d9eaf0"/>
    <text x="492" y="296" font-size="18" font-weight="750" fill="#17324d">layer 4 has 7 cells</text>

    <rect x="431" y="334" width="397" height="52" rx="12" fill="#f5efe3" stroke="#cbbda6" stroke-width="2"/>
    <text x="630" y="366" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#17324d">k² − (k − 1)² = 2k − 1</text>
  </g>
</svg>
