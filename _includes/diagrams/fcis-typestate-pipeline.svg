<svg
  class="fp-diagram"
  viewBox="0 0 960 200"
  role="img"
  aria-labelledby="fcis-typestate-title fcis-typestate-desc"
  xmlns="http://www.w3.org/2000/svg"
>
  <title id="fcis-typestate-title">Typestate pipeline from untrusted bytes to committed receipt</title>
  <desc id="fcis-typestate-desc">
    A linear progression of types: UntrustedBytes become BoundedBytes, then CanonicalCommand,
    then AuthenticatedCommand, then ValidatedDecision, then CommitPlan, then CommittedReceipt.
    Each step narrows what the value can carry. An API can make it impossible to call commit
    with raw bytes.
  </desc>

  <defs>
    <filter id="fcis-ts-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06" />
    </filter>
    <marker
      id="fcis-ts-arrow"
      markerWidth="10"
      markerHeight="10"
      refX="8"
      refY="5"
      orient="auto"
    >
      <path d="M0,0 L10,5 L0,10 Z" fill="#3B82F6" fill-opacity="0.9" />
    </marker>
  </defs>

  <!-- Stage 1: UntrustedBytes -->
  <rect x="20" y="60" width="110" height="80" rx="16" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.20)" stroke-width="1.5" filter="url(#fcis-ts-shadow)" />
  <text x="75" y="96" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">
    Untrusted
  </text>
  <text x="75" y="112" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">
    Bytes
  </text>

  <!-- Arrow 1 -->
  <path d="M130 100 H148" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#fcis-ts-arrow)" stroke-linecap="round" />

  <!-- Stage 2: BoundedBytes -->
  <rect x="152" y="60" width="110" height="80" rx="16" fill="rgba(249,115,22,0.08)" stroke="rgba(249,115,22,0.20)" stroke-width="1.5" filter="url(#fcis-ts-shadow)" />
  <text x="207" y="96" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">
    Bounded
  </text>
  <text x="207" y="112" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">
    Bytes
  </text>

  <!-- Arrow 2 -->
  <path d="M262 100 H280" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#fcis-ts-arrow)" stroke-linecap="round" />

  <!-- Stage 3: CanonicalCommand -->
  <rect x="284" y="60" width="120" height="80" rx="16" fill="rgba(59,130,246,0.08)" stroke="rgba(59,130,246,0.20)" stroke-width="1.5" filter="url(#fcis-ts-shadow)" />
  <text x="344" y="96" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">
    Canonical
  </text>
  <text x="344" y="112" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">
    Command
  </text>

  <!-- Arrow 3 -->
  <path d="M404 100 H422" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#fcis-ts-arrow)" stroke-linecap="round" />

  <!-- Stage 4: AuthenticatedCommand -->
  <rect x="426" y="60" width="125" height="80" rx="16" fill="rgba(59,130,246,0.10)" stroke="rgba(59,130,246,0.25)" stroke-width="1.5" filter="url(#fcis-ts-shadow)" />
  <text x="488" y="96" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">
    Authenticated
  </text>
  <text x="488" y="112" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">
    Command
  </text>

  <!-- Arrow 4 -->
  <path d="M551 100 H569" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#fcis-ts-arrow)" stroke-linecap="round" />

  <!-- Stage 5: ValidatedDecision -->
  <rect x="573" y="60" width="120" height="80" rx="16" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.30)" stroke-width="1.5" filter="url(#fcis-ts-shadow)" />
  <text x="633" y="96" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">
    Validated
  </text>
  <text x="633" y="112" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">
    Decision
  </text>

  <!-- Arrow 5 -->
  <path d="M693 100 H711" stroke="#3B82F6" stroke-width="2.5" marker-end="url(#fcis-ts-arrow)" stroke-linecap="round" />

  <!-- Stage 6: CommitPlan -->
  <rect x="715" y="60" width="100" height="80" rx="16" fill="rgba(59,130,246,0.12)" stroke="rgba(59,130,246,0.30)" stroke-width="1.5" filter="url(#fcis-ts-shadow)" />
  <text x="765" y="104" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">
    CommitPlan
  </text>

  <!-- Arrow 6 -->
  <path d="M815 100 H833" stroke="#10B981" stroke-width="2.5" marker-end="url(#fcis-ts-arrow)" stroke-linecap="round" />

  <!-- Stage 7: CommittedReceipt -->
  <rect x="837" y="60" width="115" height="80" rx="16" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.30)" stroke-width="1.5" filter="url(#fcis-ts-shadow)" />
  <text x="894" y="96" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">
    Committed
  </text>
  <text x="894" y="112" font-size="11" font-weight="700" fill="#1E293B" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, monospace">
    Receipt
  </text>

  <!-- Phase labels -->
  <text x="75" y="168" font-size="10" font-weight="700" fill="#EF4444" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif" letter-spacing="0.5">
    SHELL
  </text>
  <text x="207" y="168" font-size="10" font-weight="700" fill="#F97316" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif" letter-spacing="0.5">
    SHELL
  </text>
  <text x="344" y="168" font-size="10" font-weight="700" fill="#3B82F6" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif" letter-spacing="0.5">
    BOUNDARY
  </text>
  <text x="488" y="168" font-size="10" font-weight="700" fill="#3B82F6" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif" letter-spacing="0.5">
    BOUNDARY
  </text>
  <text x="633" y="168" font-size="10" font-weight="700" fill="#3B82F6" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif" letter-spacing="0.5">
    CORE
  </text>
  <text x="765" y="168" font-size="10" font-weight="700" fill="#3B82F6" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif" letter-spacing="0.5">
    BOUNDARY
  </text>
  <text x="894" y="168" font-size="10" font-weight="700" fill="#10B981" text-anchor="middle" font-family="Atkinson Hyperlegible, system-ui, sans-serif" letter-spacing="0.5">
    SHELL
  </text>
</svg>
