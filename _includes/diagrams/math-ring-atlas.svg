<svg class="fp-diagram" viewBox="0 0 960 560" role="img" aria-labelledby="math-ring-atlas-title math-ring-atlas-desc" xmlns="http://www.w3.org/2000/svg">
  <title id="math-ring-atlas-title">An atlas of ring properties</title>
  <desc id="math-ring-atlas-desc">All rings form a large background. The Boolean-ring filter sits completely inside the commutative-ring filter and partly overlaps the Noetherian filter. A separate implication trail runs from Euclidean domains through principal ideal domains and unique factorization domains to integral domains.</desc>
  <defs>
    <filter id="math-ring-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#172033" flood-opacity="0.12" />
    </filter>
    <marker id="math-ring-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#263650" />
    </marker>
  </defs>
  <style>
    .ring-trail { stroke-dasharray: 5 8; }
  </style>
  <rect x="20" y="20" width="920" height="520" rx="34" fill="#fbfcf8" stroke="#d2d9c8" stroke-width="2" />
  <text x="60" y="68" font-size="24" font-weight="800" fill="#172033" font-family="Atkinson Hyperlegible, system-ui, sans-serif">Rings need an atlas, not one family tree</text>
  <text x="60" y="94" font-size="14" fill="#536076" font-family="Atkinson Hyperlegible, system-ui, sans-serif">Some labels overlap. Other labels form true implication trails. The arrow type matters.</text>

  <g filter="url(#math-ring-shadow)">
    <rect x="58" y="130" width="530" height="292" rx="28" fill="#edf1e8" stroke="#82916f" stroke-width="2" />
  </g>
  <text x="84" y="164" font-size="16" font-weight="800" fill="#435137" font-family="Atkinson Hyperlegible, system-ui, sans-serif">ALL RINGS · the big habitat</text>
  <ellipse class="ring-filter ring-filter-1" cx="250" cy="285" rx="170" ry="120" fill="#75a8e0" fill-opacity="0.47" stroke="#4a7fbd" stroke-width="2" />
  <ellipse class="ring-filter ring-filter-2" cx="405" cy="275" rx="130" ry="102" fill="#efaa62" fill-opacity="0.43" stroke="#c77831" stroke-width="2" />
  <ellipse class="ring-filter ring-filter-3" cx="300" cy="337" rx="72" ry="48" fill="#a787ca" fill-opacity="0.55" stroke="#7955a2" stroke-width="2" />
  <g font-family="Atkinson Hyperlegible, system-ui, sans-serif" text-anchor="middle">
    <text x="198" y="207" font-size="15" font-weight="800" fill="#244f82">COMMUTATIVE</text>
    <text x="198" y="228" font-size="13" fill="#244f82">ab = ba</text>
    <text x="444" y="209" font-size="15" font-weight="800" fill="#8c4c16">NOETHERIAN</text>
    <text x="444" y="231" font-size="11" fill="#8c4c16">left + right chains stop</text>
    <text x="300" y="334" font-size="14" font-weight="800" fill="#5f3b86">BOOLEAN</text>
    <text x="300" y="355" font-size="13" fill="#5f3b86">x² = x</text>
    <rect x="326" y="250" width="102" height="42" rx="15" fill="#ffffff" fill-opacity="0.9" stroke="#637083" />
    <text x="377" y="268" font-size="11" font-weight="800" fill="#172033">FILTERS MAY</text>
    <text x="377" y="283" font-size="11" fill="#536076">OVERLAP</text>
  </g>

  <g font-family="Atkinson Hyperlegible, system-ui, sans-serif">
    <text x="630" y="144" font-size="16" font-weight="800" fill="#172033">A true implication trail</text>
    <text x="630" y="168" font-size="13" fill="#536076">Every box above is a special case</text>
    <text x="630" y="187" font-size="13" fill="#536076">of every box below it.</text>
  </g>
  <g filter="url(#math-ring-shadow)" font-family="Atkinson Hyperlegible, system-ui, sans-serif" text-anchor="middle">
    <rect x="646" y="214" width="236" height="54" rx="16" fill="#fff4d8" stroke="#c78f2d" stroke-width="2" />
    <text x="764" y="247" font-size="14" font-weight="800" fill="#172033">EUCLIDEAN DOMAIN</text>
    <rect x="646" y="294" width="236" height="54" rx="16" fill="#eaf3ff" stroke="#4f83c3" stroke-width="2" />
    <text x="764" y="327" font-size="14" font-weight="800" fill="#172033">PRINCIPAL IDEAL DOMAIN</text>
    <rect x="646" y="374" width="236" height="54" rx="16" fill="#ecf8f1" stroke="#4f9c70" stroke-width="2" />
    <text x="764" y="398" font-size="12" font-weight="800" fill="#172033">UNIQUE FACTORIZATION</text>
    <text x="764" y="414" font-size="12" font-weight="800" fill="#172033">DOMAIN</text>
    <rect x="646" y="454" width="236" height="54" rx="16" fill="#f5edfc" stroke="#8662ab" stroke-width="2" />
    <text x="764" y="487" font-size="14" font-weight="800" fill="#172033">INTEGRAL DOMAIN</text>
  </g>
  <g class="ring-trail" fill="none" stroke="#263650" stroke-width="3" marker-end="url(#math-ring-arrow)">
    <path d="M764 268 V286" />
    <path d="M764 348 V366" />
    <path d="M764 428 V446" />
  </g>
  <rect x="78" y="454" width="500" height="54" rx="18" fill="#172033" />
  <text x="328" y="477" text-anchor="middle" font-size="13" font-weight="800" fill="#ffffff" font-family="Atkinson Hyperlegible, system-ui, sans-serif">FILTER = “also obeys this property”</text>
  <text x="328" y="497" text-anchor="middle" font-size="12" fill="#dce6f7" font-family="Atkinson Hyperlegible, system-ui, sans-serif">An object may pass several filters at once.</text>
</svg>
